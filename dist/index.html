<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEST BANK - Dinamic 1985</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0500;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #controls {
            margin-top: 10px;
            color: #886600;
            font-size: 11px;
            letter-spacing: 2px;
            text-align: center;
        }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="controls">↑/↓ MOVER &nbsp;|&nbsp; ESPACIO DISPARAR &nbsp;|&nbsp; P PAUSA &nbsp;|&nbsp; ENTER JUGAR</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 800, H = 480;
canvas.width  = W;
canvas.height = H;

function resize() {
    const s = Math.min(window.innerWidth / W, (window.innerHeight - 36) / H);
    canvas.style.width  = (W * s) + 'px';
    canvas.style.height = (H * s) + 'px';
}
resize();
window.addEventListener('resize', resize);

// ── Audio (Web Audio API retro beeps) ─────────────────────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audio;
try { audio = new AudioCtx(); } catch(e) { audio = null; }

function beep(freq, dur, vol=0.15, type='square') {
    if (!audio) return;
    if (audio.state === 'suspended') audio.resume();
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.connect(g); g.connect(audio.destination);
    o.type = type;
    o.frequency.setValueAtTime(freq, audio.currentTime);
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
    o.start(audio.currentTime);
    o.stop(audio.currentTime + dur);
}

function sfxShoot()   { beep(880, 0.07, 0.12, 'sawtooth'); }
function sfxHitEnemy(){ beep(220, 0.18, 0.18, 'square');   beep(110, 0.25, 0.12, 'sawtooth'); }
function sfxHitPlayer(){ beep(80, 0.35, 0.25, 'sawtooth'); beep(60, 0.4, 0.2, 'square'); }
function sfxLevelUp() {
    [523,659,784,1047].forEach((f,i) => setTimeout(() => beep(f, 0.2, 0.2, 'square'), i*120));
}
function sfxEnemyShoot() { beep(440, 0.06, 0.08, 'sawtooth'); }

// ── Constants ──────────────────────────────────────────────────────────────────
const GROUND_Y = 370;

// Four horizontal lanes where characters stand (feet y)
const LANES = [210, 270, 320, 370];

// ── State ─────────────────────────────────────────────────────────────────────
let state = 'title'; // title | playing | paused | levelup | dead | gameover
let score = 0, lives = 3, wave = 1;
let enemiesKilled = 0, enemiesPerWave = 0, totalSpawned = 0;
let waveBonus = 0, waveComplete = false;
let spawnTimer = 0, spawnInterval = 0;
let moveCooldown = 0;
let gameOverTimer = 0;

// ── Entities ──────────────────────────────────────────────────────────────────
let player = {};
let bullets = [], eBullets = [], enemies = [];
let particles = [], explosions = [];

function initPlayer() {
    player = {
        x: 90, lane: 2, y: LANES[2],
        shootCD: 0, invincible: 0,
        dead: false, shooting: false,
    };
}

function resetWave() {
    bullets = []; eBullets = []; enemies = [];
    particles = []; explosions = [];
    spawnTimer    = 0;
    spawnInterval = Math.max(55, 190 - wave * 18);
    enemiesPerWave = 6 + wave * 2;
    totalSpawned   = 0;
    enemiesKilled  = 0;
    waveComplete   = false;
    moveCooldown   = 0;
    initPlayer();
    player.invincible = 150;
}

function startGame() {
    score = 0; lives = 3; wave = 1;
    resetWave();
    state = 'playing';
}

function nextWave() {
    wave++;
    score += waveBonus;
    resetWave();
    state = 'playing';
}

// ── Enemy factory ─────────────────────────────────────────────────────────────
function spawnEnemy() {
    const lane  = Math.floor(Math.random() * 4);
    let type = 'normal';
    const r = Math.random();
    if (wave >= 2 && r < 0.15) type = 'fast';
    if (wave >= 4 && r < 0.08) type = 'boss';

    const baseSpeed = 0.7 + wave * 0.12 + Math.random() * 0.3;
    const speed = type === 'fast' ? baseSpeed * 1.6 : baseSpeed;
    const stopX  = 180 + Math.random() * 220;

    enemies.push({
        x: W + 30, lane, y: LANES[lane],
        w: 22, h: 40, speed, stopX,
        stopped: false,
        type,
        hp: type === 'boss' ? 3 : 1,
        maxHp: type === 'boss' ? 3 : 1,
        shootTimer: 90 + Math.floor(Math.random() * 90),
        shootCD:    80 + Math.floor(Math.random() * 60),
        dead: false, deathTimer: 0,
    });
}

// ── Input ─────────────────────────────────────────────────────────────────────
const keys = {};
const justPressed = {};

document.addEventListener('keydown', e => {
    if (!keys[e.code]) justPressed[e.code] = true;
    keys[e.code] = true;

    if (e.code === 'KeyP') {
        if (state === 'playing') state = 'paused';
        else if (state === 'paused') state = 'playing';
    }
    if ((e.code === 'Enter' || e.code === 'Space') && state === 'title') startGame();
    if (e.code === 'Enter' && state === 'gameover')  startGame();
    if (e.code === 'Enter' && state === 'levelup')   nextWave();

    if (['Space','ArrowUp','ArrowDown','KeyW','KeyS','KeyZ','KeyX'].includes(e.code))
        e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function clearJustPressed() {
    for (const k in justPressed) delete justPressed[k];
}

// ── Update ─────────────────────────────────────────────────────────────────────
function updatePlayer() {
    if (player.dead) return;
    if (player.invincible > 0) player.invincible--;
    if (player.shootCD > 0)    player.shootCD--;
    player.shooting = false;

    if (moveCooldown > 0) moveCooldown--;

    if ((keys['ArrowUp'] || keys['KeyW']) && moveCooldown === 0 && player.lane > 0) {
        player.lane--;
        player.y = LANES[player.lane];
        moveCooldown = 12;
    }
    if ((keys['ArrowDown'] || keys['KeyS']) && moveCooldown === 0 && player.lane < 3) {
        player.lane++;
        player.y = LANES[player.lane];
        moveCooldown = 12;
    }

    if ((keys['Space'] || keys['KeyZ'] || keys['KeyX']) && player.shootCD === 0) {
        const bulletY = player.y - 14;
        bullets.push({ x: player.x + 32, y: bulletY, vy: 0, speed: 11 });
        player.shootCD = 16;
        player.shooting = true;
        sfxShoot();
    }
}

function updateBullets() {
    bullets  = bullets.filter(b => { b.x += b.speed; return b.x < W + 10; });
    eBullets = eBullets.filter(b => { b.x -= b.speed; return b.x > -10; });
}

function updateEnemies() {
    // Spawn
    if (totalSpawned < enemiesPerWave) {
        spawnTimer++;
        if (spawnTimer >= spawnInterval) {
            spawnEnemy();
            totalSpawned++;
            spawnTimer = 0;
        }
    }

    for (const e of enemies) {
        if (e.dead) { e.deathTimer--; continue; }

        // Walk
        if (!e.stopped) {
            e.x -= e.speed;
            if (e.x <= e.stopX) e.stopped = true;
        }

        // Shoot (only when on same lane as player)
        e.shootTimer--;
        if (e.shootTimer <= 0) {
            if (e.lane === player.lane && !player.dead) {
                eBullets.push({
                    x: e.x - 30, y: e.y - 14,
                    speed: 4 + wave * 0.35,
                    lane: e.lane,
                });
                sfxEnemyShoot();
            }
            e.shootTimer = e.shootCD + Math.floor(Math.random() * 60);
        }

        // Reach player → melee hit
        if (e.x < player.x + 15) {
            hitPlayer();
            e.dead = true;
            e.deathTimer = 30;
        }
    }

    enemies = enemies.filter(e => !e.dead || e.deathTimer > 0);
}

function updateCollisions() {
    // Player bullets → enemies
    for (let bi = bullets.length - 1; bi >= 0; bi--) {
        const b = bullets[bi];
        let hit = false;
        for (let ei = enemies.length - 1; ei >= 0; ei--) {
            const e = enemies[ei];
            if (e.dead) continue;
            const eyc = e.y - 14; // enemy bullet center y
            if (Math.abs(b.y - eyc) < 22 && b.x >= e.x - 14 && b.x <= e.x + 14) {
                bullets.splice(bi, 1);
                e.hp--;
                addExplosion(e.x, eyc);
                if (e.hp <= 0) {
                    e.dead = true;
                    e.deathTimer = 28;
                    const pts = e.type === 'boss' ? 500 : e.type === 'fast' ? 200 : 100;
                    score += pts;
                    enemiesKilled++;
                    sfxHitEnemy();
                }
                hit = true;
                break;
            }
        }
        if (hit) continue;
    }

    // Enemy bullets → player
    if (!player.dead && player.invincible === 0) {
        const pyc = player.y - 14;
        for (let bi = eBullets.length - 1; bi >= 0; bi--) {
            const b = eBullets[bi];
            if (Math.abs(b.y - pyc) < 22 && b.x <= player.x + 20 && b.x >= player.x - 20) {
                eBullets.splice(bi, 1);
                hitPlayer();
                break;
            }
        }
    }
}

function hitPlayer() {
    if (player.invincible > 0 || player.dead) return;
    sfxHitPlayer();
    addExplosion(player.x, player.y - 14);
    lives--;
    if (lives <= 0) {
        player.dead = true;
        state = 'dead';
        gameOverTimer = 150;
    } else {
        player.invincible = 160;
    }
}

function checkWaveComplete() {
    if (waveComplete) return;
    if (totalSpawned >= enemiesPerWave && enemies.length === 0 && !player.dead) {
        waveComplete = true;
        waveBonus = wave * 500;
        sfxLevelUp();
        state = 'levelup';
    }
}

// ── Effects ───────────────────────────────────────────────────────────────────
function addExplosion(x, y) {
    explosions.push({ x, y, r: 4, life: 22, maxLife: 22 });
    for (let i = 0; i < 10; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd   = 1.5 + Math.random() * 3;
        particles.push({
            x, y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd - 2,
            r: 255, g: Math.floor(Math.random() * 140), b: 0,
            life: 18 + Math.floor(Math.random() * 12),
            maxLife: 30,
        });
    }
}

function updateEffects() {
    explosions = explosions.filter(e => {
        e.r += 1.5; e.life--;
        return e.life > 0;
    });
    particles = particles.filter(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life--;
        return p.life > 0;
    });
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function drawBg() {
    // Sky gradient
    const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y - 30);
    grad.addColorStop(0, '#1a3a6a');
    grad.addColorStop(1, '#5588cc');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, GROUND_Y - 30);

    // Clouds
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    [[60,28,90,18],[260,18,70,14],[500,30,100,20],[680,22,60,12]].forEach(([x,y,w,h]) => {
        ctx.fillRect(x, y, w, h);
        ctx.fillRect(x + 10, y - 8, w - 20, 10);
    });

    // Distant mountains
    ctx.fillStyle = '#3a5a8a';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y - 30);
    [0,120,200,310,420,540,650,730,800].forEach((x, i) => {
        const hy = [0, 90, 55, 110, 70, 100, 60, 85, 0][i];
        ctx.lineTo(x, GROUND_Y - 30 - hy);
    });
    ctx.lineTo(W, GROUND_Y - 30);
    ctx.fill();

    // Ground
    ctx.fillStyle = '#aa7733';
    ctx.fillRect(0, GROUND_Y - 30, W, H - GROUND_Y + 30);

    // Ground horizon line
    ctx.fillStyle = '#cc9944';
    ctx.fillRect(0, GROUND_Y - 32, W, 5);

    // Ground detail
    ctx.fillStyle = '#995522';
    for (let i = 0; i < W; i += 50) {
        ctx.fillRect(i,      GROUND_Y - 10, 28, 3);
        ctx.fillRect(i + 25, GROUND_Y +  5, 18, 2);
    }
}

function drawBank() {
    const bx = W - 180, by = GROUND_Y - 160, bw = 180, bh = 160;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(bx + 6, by + 6, bw, bh);

    // Walls
    ctx.fillStyle = '#ccaa77';
    ctx.fillRect(bx, by, bw, bh);

    // Roof / overhang
    ctx.fillStyle = '#997744';
    ctx.fillRect(bx - 12, by - 18, bw + 24, 22);

    // Roof ridge
    ctx.fillStyle = '#775522';
    ctx.fillRect(bx - 12, by - 18, bw + 24, 5);

    // Sign board
    ctx.fillStyle = '#552200';
    ctx.fillRect(bx + 20, by + 12, bw - 40, 28);
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 15px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('WEST  BANK', bx + bw / 2, by + 31);

    // Windows
    [[bx + 18, by + 52], [bx + bw - 48, by + 52]].forEach(([wx, wy]) => {
        ctx.fillStyle = '#88ccff';
        ctx.fillRect(wx, wy, 30, 28);
        ctx.strokeStyle = '#553311'; ctx.lineWidth = 3;
        ctx.strokeRect(wx, wy, 30, 28);
        // cross
        ctx.beginPath();
        ctx.moveTo(wx + 15, wy); ctx.lineTo(wx + 15, wy + 28);
        ctx.moveTo(wx, wy + 14); ctx.lineTo(wx + 30, wy + 14);
        ctx.stroke();
    });

    // Door
    ctx.fillStyle = '#442211';
    ctx.fillRect(bx + bw / 2 - 18, by + bh - 55, 36, 55);
    ctx.strokeStyle = '#221100'; ctx.lineWidth = 2;
    ctx.strokeRect(bx + bw / 2 - 18, by + bh - 55, 36, 55);

    // Door knob
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(bx + bw / 2 + 10, by + bh - 30, 5, 5);
}

function drawCactus(x, y) {
    ctx.fillStyle = '#1a7a1a';
    ctx.fillRect(x - 7, y - 60, 14, 60);
    // left arm
    ctx.fillRect(x - 26, y - 46, 20, 10);
    ctx.fillRect(x - 26, y - 66, 10, 24);
    // right arm
    ctx.fillRect(x + 6,  y - 40, 22, 10);
    ctx.fillRect(x + 18, y - 58, 10, 24);
    // spines
    ctx.fillStyle = '#aaddaa';
    [[x-7,y-30],[x+7,y-45],[x-18,y-62],[x+22,y-55]].forEach(([sx,sy]) => {
        ctx.fillRect(sx-1, sy, 2, 6);
    });
}

function drawBarrel(x, y) {
    ctx.fillStyle = '#774422';
    ctx.fillRect(x - 14, y - 36, 28, 36);
    ctx.fillStyle = '#995533';
    ctx.fillRect(x - 12, y - 34, 24, 6);
    ctx.fillRect(x - 12, y - 22, 24, 6);
    ctx.fillStyle = '#552211';
    ctx.fillRect(x - 14, y - 36, 28, 4);
    ctx.fillRect(x - 14, y - 3,  28, 3);
    // rings
    ctx.fillStyle = '#443311';
    ctx.fillRect(x - 14, y - 14, 28, 3);
}

function drawPlayer() {
    const p = player;
    if (p.dead) {
        // fallen sprite
        ctx.fillStyle = '#2244aa';
        ctx.fillRect(p.x - 22, p.y - 8, 44, 10);
        ctx.fillStyle = '#ffcc99';
        ctx.fillRect(p.x + 14, p.y - 14, 12, 10);
        return;
    }

    if (p.invincible > 0 && Math.floor(p.invincible / 5) % 2 === 1) return;

    const x = p.x, y = p.y;

    // Hat brim + crown
    ctx.fillStyle = '#663300';
    ctx.fillRect(x - 14, y - 40, 28, 5);
    ctx.fillRect(x - 9,  y - 54, 18, 17);

    // Head
    ctx.fillStyle = '#ffcc99';
    ctx.fillRect(x - 8, y - 35, 16, 15);

    // Eye
    ctx.fillStyle = '#221100';
    ctx.fillRect(x + 2, y - 30, 3, 3);

    // Badge ★
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(x - 2, y - 24, 6, 6);

    // Body
    ctx.fillStyle = '#2244aa';
    ctx.fillRect(x - 11, y - 20, 22, 22);

    // Arm holding gun
    ctx.fillStyle = '#ffcc99';
    ctx.fillRect(x + 10, y - 16, 14, 7);
    ctx.fillStyle = '#333';
    ctx.fillRect(x + 20, y - 18, 12, 5);   // gun barrel

    // Belt
    ctx.fillStyle = '#884422';
    ctx.fillRect(x - 11, y + 2,  22, 5);

    // Holster
    ctx.fillStyle = '#663311';
    ctx.fillRect(x - 5, y + 6, 8, 10);

    // Legs
    ctx.fillStyle = '#223388';
    ctx.fillRect(x - 10, y + 7, 8, 22);
    ctx.fillRect(x + 2,  y + 7, 8, 22);

    // Boots
    ctx.fillStyle = '#332211';
    ctx.fillRect(x - 12, y + 25, 12, 7);
    ctx.fillRect(x + 1,  y + 25, 12, 7);

    // Muzzle flash
    if (p.shooting) {
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(x + 32, y - 20, 12, 7);
        ctx.fillStyle = 'rgba(255,255,100,0.5)';
        ctx.fillRect(x + 28, y - 24, 20, 15);
    }
}

function drawEnemy(e) {
    if (e.dead) {
        if (e.deathTimer > 0) {
            ctx.fillStyle = e.type === 'boss' ? '#660000' : '#881100';
            ctx.fillRect(e.x - 24, e.y - 8, 48, 10);
        }
        return;
    }

    const x = e.x, y = e.y;
    const wf = Math.floor(Date.now() / 140) % 2; // walk frame

    // Hat
    ctx.fillStyle = '#221100';
    ctx.fillRect(x - 13, y - 40, 26, 5);
    ctx.fillRect(x - 8,  y - 54, 16, 17);

    // Head
    ctx.fillStyle = '#ddaa88';
    ctx.fillRect(x - 8, y - 35, 16, 15);

    // Eye
    ctx.fillStyle = '#110000';
    ctx.fillRect(x - 6, y - 30, 3, 3);

    // Moustache
    ctx.fillStyle = '#221100';
    ctx.fillRect(x - 6, y - 22, 12, 3);

    // Body colour by type
    const bodyC = e.type === 'boss' ? '#660000' : e.type === 'fast' ? '#aa3300' : '#881100';
    ctx.fillStyle = bodyC;
    ctx.fillRect(x - 11, y - 20, 22, 22);

    // Arm + gun (pointing left)
    ctx.fillStyle = '#ddaa88';
    ctx.fillRect(x - 26, y - 16, 16, 7);
    ctx.fillStyle = '#444';
    ctx.fillRect(x - 38, y - 18, 14, 5);

    // Belt
    ctx.fillStyle = '#552211';
    ctx.fillRect(x - 11, y + 2,  22, 5);

    // Legs (walking)
    ctx.fillStyle = '#332211';
    const l1h = wf === 0 ? 20 : 24, l2h = wf === 0 ? 24 : 20;
    ctx.fillRect(x - 10, y + 7, 8, l1h);
    ctx.fillRect(x + 2,  y + 7, 8, l2h);

    // Boots
    ctx.fillStyle = '#221100';
    ctx.fillRect(x - 12, y + 25, 12, 7);
    ctx.fillRect(x + 1,  y + 25, 12, 7);

    // Boss sombrero extra / skull
    if (e.type === 'boss') {
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(x - 5, y - 30, 10, 10);
        ctx.fillStyle = '#221100';
        ctx.fillRect(x - 3, y - 28, 3, 3);
        ctx.fillRect(x + 1, y - 28, 3, 3);
    }

    // HP bar for boss
    if (e.type === 'boss' && e.hp < e.maxHp) {
        ctx.fillStyle = '#330000';
        ctx.fillRect(x - 18, y - 62, 36, 6);
        ctx.fillStyle = '#ff2200';
        ctx.fillRect(x - 18, y - 62, 36 * (e.hp / e.maxHp), 6);
        ctx.strokeStyle = '#ff8800'; ctx.lineWidth = 1;
        ctx.strokeRect(x - 18, y - 62, 36, 6);
    }
}

function drawBullet(b, isEnemy) {
    ctx.fillStyle = isEnemy ? '#ff6600' : '#ffff44';
    ctx.fillRect(b.x - 5, b.y - 2, 10, 4);
    ctx.fillStyle = isEnemy ? 'rgba(255,80,0,0.35)' : 'rgba(255,255,80,0.35)';
    ctx.fillRect(b.x - 8, b.y - 5, 16, 10);
}

function drawEffects() {
    for (const ex of explosions) {
        const a = ex.life / ex.maxLife;
        ctx.fillStyle = `rgba(255,200,0,${a * 0.8})`;
        ctx.beginPath();
        ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255,80,0,${a * 0.6})`;
        ctx.beginPath();
        ctx.arc(ex.x, ex.y, ex.r * 0.55, 0, Math.PI * 2);
        ctx.fill();
    }
    for (const p of particles) {
        const a = p.life / p.maxLife;
        ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${a})`;
        ctx.fillRect(p.x - 2, p.y - 2, 5, 5);
    }
}

function drawHUD() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, H - 58, W, 58);
    ctx.fillStyle = '#552200';
    ctx.fillRect(0, H - 60, W, 3);

    // Score
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 17px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText('PUNTOS: ' + String(score).padStart(6,'0'), 16, H - 34);

    // Lives
    ctx.fillStyle = '#ff4444';
    ctx.textAlign = 'center';
    ctx.fillText('VIDAS', W/2, H - 34);
    for (let i = 0; i < Math.max(lives, 0); i++) {
        // tiny sheriff icon
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(W/2 - 42 + i * 28, H - 22, 10, 14);
        ctx.fillStyle = '#2244aa';
        ctx.fillRect(W/2 - 44 + i * 28, H - 14, 14, 8);
    }

    // Wave
    ctx.fillStyle = '#44ffff';
    ctx.textAlign = 'right';
    ctx.fillText('OLA: ' + wave, W - 16, H - 34);

    // Wave progress bar
    const progress = Math.min(enemiesKilled / enemiesPerWave, 1);
    ctx.fillStyle = '#331100';
    ctx.fillRect(W/2 - 90, H - 20, 180, 9);
    const barGrad = ctx.createLinearGradient(W/2 - 90, 0, W/2 + 90, 0);
    barGrad.addColorStop(0, '#ff4400');
    barGrad.addColorStop(1, '#ffff00');
    ctx.fillStyle = barGrad;
    ctx.fillRect(W/2 - 90, H - 20, 180 * progress, 9);
    ctx.strokeStyle = '#ffaa00'; ctx.lineWidth = 1;
    ctx.strokeRect(W/2 - 90, H - 20, 180, 9);
}

function drawTitle() {
    // Sky bg
    ctx.fillStyle = '#1a0a00';
    ctx.fillRect(0, 0, W, H);

    // Stars
    ctx.fillStyle = '#ffffff';
    [[50,40],[200,20],[400,60],[600,30],[750,50],[350,15],[120,80]].forEach(([x,y]) =>
        ctx.fillRect(x, y, 2, 2));

    // Title text with shadow
    ctx.fillStyle = '#cc6600';
    ctx.font = 'bold 64px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('WEST BANK', W/2 + 3, 113);
    ctx.fillStyle = '#ffd700';
    ctx.fillText('WEST BANK', W/2, 110);

    // Subtitle
    ctx.fillStyle = '#cc8800';
    ctx.font = '18px Courier New';
    ctx.fillText('DINAMIC SOFTWARE  1985', W/2, 143);

    // Separator
    ctx.strokeStyle = '#cc6600'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(80, 158); ctx.lineTo(W - 80, 158); ctx.stroke();

    // Preview characters
    const tp = { x: 180, y: 290, invincible: 0, dead: false, shooting: false, lane: 2 };
    const te = { x: 600, y: 290, dead: false, deathTimer: 0, type: 'boss',
                 hp: 3, maxHp: 3, lane: 2 };
    const savedPlayer = Object.assign({}, player);
    Object.assign(player, tp);
    drawPlayer();
    Object.assign(player, savedPlayer);
    drawEnemy(te);
    drawCactus(380, GROUND_Y - 10);
    drawBarrel(260, 290);

    // VS
    ctx.fillStyle = '#ff4400';
    ctx.font = 'bold 30px Courier New';
    ctx.fillText('VS', W/2, 300);

    // Instructions
    ctx.fillStyle = '#dddddd';
    ctx.font = '15px Courier New';
    ctx.fillText('↑ / ↓   MOVER      ESPACIO   DISPARAR', W/2, 375);
    ctx.fillStyle = '#aaaaaa';
    ctx.fillText('P   PAUSA', W/2, 398);

    // Blink start
    if (Math.floor(Date.now() / 520) % 2 === 0) {
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 20px Courier New';
        ctx.fillText('▶  PULSA  ENTER  PARA  EMPEZAR  ◀', W/2, 440);
    }

    ctx.fillStyle = '#664400';
    ctx.font = '12px Courier New';
    ctx.fillText('VERSION WEB · 2024', W/2, H - 8);
}

function drawOverlay(title, titleColor, sub1, sub2, blink) {
    ctx.fillStyle = 'rgba(0,0,0,0.78)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = titleColor;
    ctx.font = 'bold 52px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(title, W/2, H/2 - 50);

    ctx.fillStyle = '#ffd700';
    ctx.font = '22px Courier New';
    ctx.fillText(sub1, W/2, H/2 + 10);

    if (blink && Math.floor(Date.now() / 560) % 2 === 0) {
        ctx.fillStyle = '#ffffff';
        ctx.font = '17px Courier New';
        ctx.fillText(sub2, W/2, H/2 + 58);
    }
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function loop() {
    requestAnimationFrame(loop);

    if (state === 'title') { drawTitle(); clearJustPressed(); return; }

    if (state === 'gameover') {
        drawBg(); drawBank();
        drawCactus(280, GROUND_Y - 10); drawCactus(520, GROUND_Y - 10);
        drawBarrel(130, LANES[0]); drawBarrel(130, LANES[2]);
        drawPlayer(); drawHUD();
        drawOverlay('GAME OVER', '#ff2200',
            'PUNTUACIÓN: ' + score,
            'ENTER → VOLVER A JUGAR', true);
        clearJustPressed(); return;
    }

    if (state === 'levelup') {
        drawBg(); drawBank();
        drawCactus(280, GROUND_Y - 10); drawCactus(520, GROUND_Y - 10);
        drawBarrel(130, LANES[0]); drawBarrel(130, LANES[2]);
        drawPlayer(); drawHUD();
        drawOverlay(`¡OLA ${wave} SUPERADA!`, '#00ff88',
            'BONUS: +' + waveBonus + '  TOTAL: ' + (score + waveBonus),
            'ENTER → SIGUIENTE OLA', true);
        clearJustPressed(); return;
    }

    if (state === 'dead') {
        gameOverTimer--;
        if (gameOverTimer <= 0) state = 'gameover';
        drawBg(); drawBank();
        drawCactus(280, GROUND_Y - 10); drawCactus(520, GROUND_Y - 10);
        drawBarrel(130, LANES[0]); drawBarrel(130, LANES[2]);
        drawPlayer();
        for (const e of enemies) drawEnemy(e);
        for (const b of bullets) drawBullet(b, false);
        for (const b of eBullets) drawBullet(b, true);
        drawEffects(); drawHUD();
        clearJustPressed(); return;
    }

    if (state === 'paused') {
        drawBg(); drawBank();
        drawCactus(280, GROUND_Y - 10); drawCactus(520, GROUND_Y - 10);
        drawBarrel(130, LANES[0]); drawBarrel(130, LANES[2]);
        for (const e of enemies) drawEnemy(e);
        for (const b of bullets) drawBullet(b, false);
        for (const b of eBullets) drawBullet(b, true);
        drawPlayer(); drawHUD();
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 52px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSA', W/2, H/2);
        ctx.fillStyle = '#aaaaaa';
        ctx.font = '18px Courier New';
        ctx.fillText('P → CONTINUAR', W/2, H/2 + 48);
        clearJustPressed(); return;
    }

    // ── state === 'playing' ──
    updatePlayer();
    updateBullets();
    updateEnemies();
    updateCollisions();
    updateEffects();
    checkWaveComplete();
    clearJustPressed();

    // Draw scene
    drawBg();
    drawBank();
    drawCactus(280, GROUND_Y - 10);
    drawCactus(520, GROUND_Y - 10);
    drawCactus(610, GROUND_Y - 10);
    drawBarrel(130, LANES[0]);
    drawBarrel(130, LANES[2]);

    for (const e of enemies) drawEnemy(e);
    for (const b of bullets)  drawBullet(b, false);
    for (const b of eBullets) drawBullet(b, true);
    drawPlayer();
    drawEffects();
    drawHUD();
}

requestAnimationFrame(loop);
</script>
</body>
</html>
